# ===========================================================================
# 🔒 hyprlock — tela de bloqueio
# ===========================================================================
# Chamado por ~/.local/bin/lock-screen.sh, que por sua vez esta' no SUPER+L
# do hyprland.conf. O lock-screen.sh e' quem decide entre hyprlock e swaylock,
# entao este arquivo so' cuida da aparencia.
#
# As cores NAO estao escritas a mao: vem do mesmo scheme que o resto do
# desktop usa. Trocou o wallpaper e o scheme mudou? A tela de bloqueio
# acompanha sozinha.
source = ~/.config/hypr/scheme/current.conf

general {
    hide_cursor = true
    ignore_empty_input = true          # Enter sem digitar nada nao conta erro
}

# Fundo: screenshot da propria tela, borrado.
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.17
}

# Relogio
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb($onSurface)
    font_size = 110
    font_family = SF Pro Display
    position = 0, 260
    halign = center
    valign = center
}

# Data
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    color = rgb($onSurfaceVariant)
    font_size = 22
    font_family = SF Pro Text
    position = 0, 170
    halign = center
    valign = center
}

# Usuario
label {
    monitor =
    text = $USER
    color = rgb($onSurfaceVariant)
    font_size = 16
    font_family = SF Pro Text
    position = 0, 70
    halign = center
    valign = center
}

# Campo de senha
input-field {
    monitor =
    size = 340, 56
    outline_thickness = 3
    dots_size = 0.28
    dots_spacing = 0.32
    dots_center = true
    outer_color = rgb($primary)
    inner_color = rgb($surfaceContainer)
    font_color = rgb($onSurface)
    check_color = rgb($tertiary)
    fail_color = rgb($error)
    fail_text = <i>Senha incorreta ($ATTEMPTS)</i>
    placeholder_text = <i>Digite a senha</i>
    rounding = 12
    shadow_passes = 2
    position = 0, -20
    halign = center
    valign = center
}
