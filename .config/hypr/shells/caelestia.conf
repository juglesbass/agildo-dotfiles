# ===== SHELL: Caelestia (quickshell) =====================================
# Ativado por: switch-shell.sh caelestia

env = CAELESTIA_WALLPAPERS_DIR,/home/agildo/Pictures/Wallpapers/Hyprland

exec-once = qs -c caelestia

# Gaveta de sessao do caelestia. Vive aqui, e nao no hyprland.conf, porque o
# IPC so' responde enquanto o caelestia estiver rodando.
bind = $mainMod, Escape, exec, qs -c caelestia ipc call drawers toggle session
