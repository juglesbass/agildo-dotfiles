# ===== SHELL: ML4W (waybar com o tema "modern" do ML4W) ==================
# Ativado por: switch-shell.sh ml4w
#
# Roda o MESMO binario waybar, apontado para ~/.config/waybar-ml4w/, em vez de
# instalar a suite ML4W inteira. O instalador oficial do ML4W grava o proprio
# ~/.config/hypr/hyprland.conf e sobrescreveria toda a customizacao de escala
# HiDPI deste setup -- alem dos atalhos de teclado.
#
# A config em ~/.config/waybar-ml4w/ e' a do tema ml4w-modern com os modulos
# repontados para as ferramentas que existem aqui (rofi, btop, cliphist,
# wlogout, nm-connection-editor, makoctl). Detalhes no cabecalho do
# config.jsonc de la'.
#
# O waybar-ml4w-colors.sh regenera o colors.css a partir do scheme atual antes
# da barra subir, para ela nascer com as cores do resto do desktop.

exec-once = ~/.local/bin/waybar-ml4w-colors.sh
exec-once = waybar -c ~/.config/waybar-ml4w/config.jsonc -s ~/.config/waybar-ml4w/style.css
exec-once = mako

bind = $mainMod SHIFT, B, exec, /home/agildo/.local/bin/restart-waybar
