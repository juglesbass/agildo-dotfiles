# ===========================================================================
# 🌙 hypridle — bloqueio e desligamento de tela por inatividade
# ===========================================================================
# Até agora nada trancava a sessão sozinho: o hyprlock existia, mas só era
# chamado à mão pelo SUPER+L. Sair da frente do PC deixava tudo aberto.
#
# Não há passo de escurecer antes de travar porque esta máquina não tem
# backlight nenhum em /sys/class/backlight — o monitor é uma TV por HDMI, e
# TV não expõe controle de brilho ao sistema. Escurecer exigiria mexer no
# gamma do compositor, o que apaga o ecrã inteiro em vez de atenuar.

general {
    # Usa o mesmo script do SUPER+L, que escolhe entre hyprlock e swaylock.
    # Assim há um só lugar a mudar se um dia trocares de locker.
    lock_cmd = pidof hyprlock || ~/.local/bin/lock-screen.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# 1 hora sem atividade -> trava
listener {
    timeout = 3600
    on-timeout = loginctl lock-session
}

# 65 min -> desliga a tela.
# Fica DEPOIS do bloqueio de propósito: se desligasse antes, mexer no rato
# acenderia a tela já com o ecrã de bloqueio à frente, o que confunde.
#
# O hyprland.conf já tem mouse_move_enables_dpms e key_press_enables_dpms,
# por isso a tela volta a qualquer movimento; o on-resume aqui é a rede de
# segurança para o caso de o input chegar por outro caminho.
listener {
    timeout = 3900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
